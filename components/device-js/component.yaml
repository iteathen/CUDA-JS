      "injected_dependencies": ["canonical source text", "explicit function/type metadata", "typed compile options"],
      "adapter_boundaries": ["pinned Acorn syntax-only parser", "runtime.facade compileDeviceProgram bridge"],
      "simplest_sufficient_total_system": "One pinned commodity syntax parser, one fail-closed semantic validator/lowerer, one deterministic normalization boundary, and reuse of the existing compiler owner."
    }
  }
