    "lifecycle": "Pure JavaScript preprocessing only; owns no native resource. Generated CUDA source is private transient input to the existing CompilerActor through runtime.facade.",
    "design": {
      "owned_invariant": "Only the accepted SPEC-0013 subset reaches CUDA lowering, and public identity/lowering are deterministic by exact source, metadata, compile options, parser version, and code-unit function order.",
