{
  "schema_version": 1,
  "component": {
    "id": "runtime.driver-actor",
    "name": "CUDA DriverActor",
    "status": "accepted-f7w-internal-experimental",
    "product_area": "components",
    "path": "components/driver-actor",
    "purpose": "Provide a bounded asynchronous facade over one Worker-owned private CUDA context with opaque resources, synchronous copied and bounded pinned-staging asynchronous device transfers, PTX/cubin module launch and completion, conservative health, deterministic graceful teardown, and honest unexpected-loss reporting.",
    "public_contracts": ["index.mjs"],
    "allowed_dependencies": ["node-standard-library", "node-ffi-26.1-or-later", "runtime.resource-registry", "runtime.memory", "runtime.execution", "runtime.host-memory-transfer", "runtime.publication-mailbox", "generated-tier-0-ffi-definitions", "canonical-windows-cuda-driver"],
    "forbidden_dependencies": ["arbitrary-library", "arbitrary-signature", "returned-function-pointer-invocation", "raw-public-pointer", "consumer-semantics", "compiler", "concurrent-launch"],
    "validation": ["npm run f3:unit", "npm run f4", "npm run f5", "npm run f7"],
    "owner": "runtime.driver-actor",
    "lifecycle": "One Worker owns one library, one selected device identity, one private context, one registry, and one runtime epoch. Graceful close is explicit; unexpected loss is restart-required and makes no cleanup claim.",
    "design": {
      "owned_invariant": "Every context-dependent native call executes on the one owning Worker and no raw native capability crosses its boundary.",
      "public_ports": ["openDriverRuntime", "DriverRuntimeError"],
      "injected_dependencies": ["private backend profile", "Worker constructor", "runtime identity"],
      "adapter_boundaries": ["Windows Node FFI backend", "platform-neutral lifecycle mock"],
      "simplest_sufficient_total_system": "One async facade, one serialized Worker protocol, one context, one registry, injected bounded memory/execution/transfer owners, a fixed private stream pool, and one explicit close path."
    }
  }
}
