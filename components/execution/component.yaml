    "owner": "runtime.execution",
    "lifecycle": "One private stream is a context child; modules, functions, and completion events follow dependency order while function and memory leases fence every submitted launch through terminal completion.",
    "design": {
      "owned_invariant": "A launch cannot resolve before terminal event completion and cannot release any argument capability while device use may continue.",
      "public_ports": ["ExecutionManager", "normalizeExecutionPolicy", "parameterLayout", "packParameterValues", "ExecutionError"],
      "injected_dependencies": ["resource registry", "context token", "memory lease port", "device limits", "backend operations"],
      "adapter_boundaries": ["Windows DriverActor execution backend", "platform-neutral orchestration mock"],
      "simplest_sufficient_total_system": "One PTX-only policy owner, one private stream, one launch at a time, one event poller, and explicit resource dependencies."
    }
  }
