    "name": "Bounded module launch and completion",
    "status": "accepted-f5w-internal-experimental",
    "product_area": "components",
    "path": "components/execution",
    "purpose": "Own bounded PTX identity, declared function schemas, packed launch parameters, memory leases, one private completion event, adaptive polling, and terminal records without exposing native state.",
