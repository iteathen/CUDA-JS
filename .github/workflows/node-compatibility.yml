name: node-compatibility
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    name: probe-${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.23.2
          - 24.19.0
          - 25.9.0
          - 26.0.0
          - 26.1.0
          - 26.2.0
          - 26.3.0
          - 26.3.1
          - 26.4.0
          - 26.5.0
          - 26.5.1
          - 26.6.0
          - 26.7.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/run-node-qualification.mjs probe
  result:
    name: node-compatibility
    if: always()
    needs: probe
    runs-on: ubuntu-latest
    steps:
      - name: Require every exact-version probe
        env:
          PROBE_RESULT: ${{ needs.probe.result }}
        run: test "$PROBE_RESULT" = success
