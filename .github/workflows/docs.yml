name: docs
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/verify-docs.sh
  cleanup-merged-foundation-branch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete only the fully merged publication branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='agent/publish-foundational-docs'
          git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" || exit 0
          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "origin/${branch}" origin/main
          test "$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --head "${branch}" --json number --jq 'length')" = '0'
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
