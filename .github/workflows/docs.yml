name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.7.0
      - run: npm run f1b:generate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f1b-generated-${{ github.sha }}
          path: schemas/cuda-13.3/linux-x64/generated/
          if-no-files-found: error
      - run: git diff --exit-code -- schemas/cuda-13.3/linux-x64/generated/
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.7.0
      - run: ./scripts/verify-docs.sh
      - run: npm run exp:000:build
      - run: npm run exp:000:correctness
      - run: npm run exp:000:lifecycle
      - run: npm run f3:portable
      - run: npm run f4:portable
      - run: npm run f5:portable
      - run: npm run f6:portable
      - run: node scripts/run-f6.mjs linux-readiness
      - run: npm run f7:portable
      - run: node scripts/run-f7.mjs linux-readiness
      - run: npm run f8:portable
      - run: npm run f8:linux-readiness
      - run: npm run hardware:check
      - run: npm run node:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f6-linux-readiness-${{ github.sha }}
          path: build/f6/linux-x64/evidence/readiness.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f7-linux-readiness-${{ github.sha }}
          path: build/f7/linux-x64/evidence/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f8-linux-package-readiness-${{ github.sha }}
          path: build/f8/linux-x64/evidence/
          if-no-files-found: error
