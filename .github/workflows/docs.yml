name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.7.0
      - run: ./scripts/verify-docs.sh
      - run: npm run exp:000:build
      - run: npm run exp:000:correctness
      - run: npm run exp:000:lifecycle
      - run: npm run f3:portable
