name: external-nvidia-cuda-13-3-provenance

on:
  pull_request:
    branches: [main]
    paths:
      - "evidence/external/verify-cuda-13.3-provenance.mjs"
      - ".github/workflows/external-nvidia-cuda-13-3-provenance.yml"
      - "schemas/cuda-13.3/provenance.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-nvidia-cuda-13-3-provenance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: NVIDIA CUDA 13.3 provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Reacquire official NVIDIA package and verify provenance
        env:
          CJS_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node evidence/external/verify-cuda-13.3-provenance.mjs cuda-13.3-nvidia-provenance-result.json
      - name: Upload frozen result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cuda-13.3-nvidia-provenance-result
          path: cuda-13.3-nvidia-provenance-result.json
          if-no-files-found: error
          retention-days: 30
